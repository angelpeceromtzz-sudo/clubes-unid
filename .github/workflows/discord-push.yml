name: Discord - Notificar pushes

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar aviso profesional a Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_ANGEL: ${{ secrets.GH_ANGEL }}
          GH_JORGE: ${{ secrets.GH_JORGE }}
          GH_GUSTAVO: ${{ secrets.GH_GUSTAVO }}
          DISCORD_ANGEL: ${{ secrets.DISCORD_ANGEL }}
          DISCORD_JORGE: ${{ secrets.DISCORD_JORGE }}
          DISCORD_GUSTAVO: ${{ secrets.DISCORD_GUSTAVO }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          webhook = os.environ.get('WEBHOOK', '').strip()
          parsed = urlparse(webhook)
          if (parsed.scheme != 'https'
                  or parsed.hostname not in ('discord.com', 'discordapp.com')
                  or not re.fullmatch(r'/api(?:/v\d+)?/webhooks/\d+/[^/]+', parsed.path)
                  or parsed.query or parsed.fragment):
              raise SystemExit(
                  'DISCORD_WEBHOOK_URL debe tener el formato '
                  'https://discord.com/api/webhooks/<id>/<token>.'
              )

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as file:
              event = json.load(file)

          members = {}
          for name in ('ANGEL', 'JORGE', 'GUSTAVO'):
              gh = os.environ.get('GH_' + name, '').strip().lower()
              discord_id = os.environ.get('DISCORD_' + name, '').strip()
              if not gh or not re.fullmatch(r'\d{15,22}', discord_id):
                  raise SystemExit(f'Revisa GH_{name} y DISCORD_{name} en Repository secrets.')
              if gh in members:
                  raise SystemExit('Hay cuentas de GitHub duplicadas en los Secrets.')
              members[gh] = discord_id

          actor = os.environ['ACTOR'].strip().lower()
          if actor not in members:
              print('Push de cuenta no registrada: se enviará sin menciones.')
              mentions = []
          else:
              mentions = list(dict.fromkeys(
                  discord_id for username, discord_id in members.items()
                  if username != actor
              ))

          def clean(value, limit=180):
              text = str(value or '').replace('@', '@\u200b')
              text = text.replace('`', "'").replace('\r', ' ').replace('\n', ' ')
              return text[:limit]

          repository = os.environ['REPOSITORY']
          branch = os.environ['REF_NAME']
          branch_lower = branch.lower()
          if branch_lower == 'main':
              color, category = 0x2EA043, 'Producción'
          elif branch_lower in ('develop', 'development'):
              color, category = 0x3B82F6, 'Desarrollo'
          elif branch_lower.startswith(('feat/', 'feature/')):
              color, category = 0xA855F7, 'Funcionalidad'
          elif branch_lower.startswith(('fix/', 'bugfix/', 'hotfix/')):
              color, category = 0xF59E0B, 'Corrección'
          else:
              color, category = 0x64748B, 'Otra rama'

          compare = event.get('compare') or ''
          if not compare.startswith('https://github.com/'):
              compare = 'https://github.com/' + repository

          commits = event.get('commits') or []
          commit_lines = []
          for commit in commits[-8:]:
              full_sha = str(commit.get('id') or '')
              sha = full_sha[:7]
              message = clean((commit.get('message') or '(sin mensaje)').splitlines()[0], 110)
              if re.fullmatch(r'[a-fA-F0-9]{7,64}', full_sha):
                  url = f'https://github.com/{repository}/commit/{full_sha}'
                  commit_lines.append(f'[`{sha}`]({url}) {message}')
              else:
                  commit_lines.append(f'`{sha}` {message}')
          if len(commits) > 8:
              commit_lines.append(f'... y {len(commits) - 8} más')
          if not commit_lines:
              commit_lines.append('(Push sin commits listados)')

          description = '\n'.join(commit_lines)
          if len(description) > 4000:
              description = description[:4000].rsplit('\n', 1)[0] + '\n... (lista abreviada)'

          embed = {
              'title': f'🚀 {category} · {clean(branch, 80)}',
              'description': description,
              'color': color,
              'url': compare,
              'author': {'name': 'Clubs UNID', 'url': f'https://github.com/{repository}'},
              'footer': {'text': f'Autor: {clean(os.environ["ACTOR"], 64)}'},
          }
          timestamp = (event.get('head_commit') or {}).get('timestamp')
          if timestamp:
              embed['timestamp'] = timestamp

          payload = {
              'username': 'Clubs UNID Bot',
              'embeds': [embed],
              'allowed_mentions': {'parse': [], 'users': mentions},
          }
          if mentions:
              payload['content'] = '📢 ' + ' '.join(f'<@{uid}>' for uid in mentions)

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'User-Agent': 'ClubsUNID-GitHubActions/1.0'
              },
              method='POST'
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print('Discord respondió:', response.status)
          except urllib.error.HTTPError as error:
              print('Error HTTP al publicar en Discord:', error.code)
              # Evitar imprimir el cuerpo completo o URLs privadas en los logs.
              raise SystemExit('No se pudo enviar el mensaje; verifica el webhook y los permisos.') from None
          PY
