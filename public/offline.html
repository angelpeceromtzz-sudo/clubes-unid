<!doctype html>
<html lang="es-MX" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b111e" />
    <title>Sin conexión — Clubs UNID</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b111e;
        color: #e2e8f0;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 32px 24px;
        border-radius: 20px;
        background: #0e162c;
        border: 1px solid #1e293b;
        box-shadow: 0 10px 40px rgba(0,0,0,.4);
      }
      .logo {
        width: 72px; height: 72px; margin: 0 auto 16px;
        border-radius: 18px;
        background: linear-gradient(180deg, #fbbf24, #1d4ed8 50%, #7c3aed);
        display: flex; align-items: center; justify-content: center;
        font-size: 32px;
      }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 800; }
      p { margin: 0 0 20px; font-size: 14px; color: #94a3b8; line-height: 1.5; }
      button {
        border: none; cursor: pointer;
        padding: 10px 20px; border-radius: 10px;
        background: #fbbf24; color: #0b111e;
        font-weight: 700; font-size: 14px;
      }
      button:hover { background: #f59e0b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">📡</div>
      <h1>Sin conexión</h1>
      <p>No pudimos cargar esta página porque no hay conexión a internet. Revisa tu red e inténtalo de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
